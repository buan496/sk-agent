services:
  db:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sk_agent}
      POSTGRES_USER: ${POSTGRES_USER:-sk_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sk_agent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sk_agent} -d ${POSTGRES_DB:-sk_agent}"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5-community}
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-sk_agent_neo4j}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    environment:
      PYTHONPATH: /app
      LOCAL_REPO_PATH: ${LOCAL_REPO_PATH:-/repo-cache/SK}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_RAW_BASE_URL: ${GITHUB_RAW_BASE_URL:-}
      SK_REPO_URL: ${SK_REPO_URL:-https://github.com/MRYGP/SK.git}
      SKGPT_REPO_URL: ${SKGPT_REPO_URL:-https://github.com/MRYGP/SKGPT.git}
      SK_REPO_LOCAL_PATH: ${SK_REPO_LOCAL_PATH:-}
      SKGPT_REPO_LOCAL_PATH: ${SKGPT_REPO_LOCAL_PATH:-}
      SKGPT_BRANCH: ${SKGPT_BRANCH:-main}
      REPO_SYNC_URL: ${REPO_SYNC_URL:-https://github.com/MRYGP/SK.git}
      REPO_SYNC_PATH: ${REPO_SYNC_PATH:-/repo-cache/SK}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sk_agent}
      POSTGRES_USER: ${POSTGRES_USER:-sk_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sk_agent}
      LLM_PROVIDER: ${LLM_PROVIDER:-minimax}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.io/v1}
      MINIMAX_CHAT_ENDPOINT: ${MINIMAX_CHAT_ENDPOINT:-/chat/completions}
      MINIMAX_CHAT_MODEL: ${MINIMAX_CHAT_MODEL:-MiniMax-M2.7}
      MINIMAX_TEMPERATURE: ${MINIMAX_TEMPERATURE:-0.2}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-sk_agent_neo4j}
      MEMORY_DIR: /memory
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-tavily}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data/repo_cache:/repo-cache
      - ${SK_REPO_PATH:-./data/repo_cache}:/sk-repo:ro
      - ./memory:/memory:ro
      - ./docs:/docs:ro
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
    environment:
      INTERNAL_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./docs:/docs:ro
    depends_on:
      - backend

  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:latest}
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Shanghai}
      TZ: ${GENERIC_TIMEZONE:-Asia/Shanghai}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-local-only}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-sk_agent_n8n}
      SK_AGENT_API_BASE_URL: http://backend:8000
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
  n8n_data:
